name: mini_ecommerce_flutter
description: "Mini E-Commerce Flutter Client with GetX and Freezed connected to ASP.NET Core DDD API"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.19.0
  webview_flutter: ^4.7.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.15.1
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
